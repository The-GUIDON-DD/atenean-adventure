start:
  - show sky: WITH FADE
  - wait: 500
  - show introClouds: WITH FADE AT 720,700
  - show enterName: WITH FADE AT 725,430 CONTINUE
  - show textBoxBg: WITH FADE AT 730,548
  - call TextInput:
    propertyType: name
    propertyName: player
  - hide textBoxBg: WITH FADE CONTINUE
  - hide enterName: WITH FADE
  - call characterSelect:
      characters:
        - id: c1
          x: 250
          y: 400
          spriteKey: c1_select
        - id: c2
          x: 550
          y: 600
          spriteKey: c2_select
        - id: c3
          x: 850
          y: 400
          spriteKey: c3_select
        - id: c4
          x: 1150
          y: 600
          spriteKey: c4_select
      confirmX: 600
      confirmY: 850
      confirmSprite: letsStartBtn
      varName: selected_char
  - hide introClouds: WITH FADE
  - scene: prologue
prologue:
  - show coveredcourts: WITH FADE CONTINUE
  - text: You just got out of your PE class and have 30 minutes to spare until your next one in Areté.
  - text: As you rummage through your bag, you come across a letter directing you to choose a different, longer path to class to determine your fate at Ateneo...
  - show introLetter: AT 720,1200
    zoom: 0
  - show bag: AT 720,1200
  - animate bag:
    time: 750
    position:
      x: 720
      y: 900
  - animate introLetter:
    time: 750
    zoom: 1
    angle: -5
    position:
      x: 720
      y: 500
  - wait: 500
  - animate introLetter:
    time: 750
    zoom: 1.75
  - wait: 500
  - hide bag: WITH FADEOUT
  - hide introLetter:
  - scene: letterOpenScene
letterOpenScene:
  - show letterLayerBack: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerMiddle: AT 720,650 WITH FUSION CONTINUE
  - show letterLayerFront: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerBack: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerFront: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerMiddle: AT 720,500 WITH MOVE
  - wait: 1000
  - hide letterLayerMiddle: WITH FADE CONTINUE
  - letter says: "Dear {TextInputName_player},\nIf you are reading this, that means you have just started your freshman year at the Ateneo. You may be worried about what kind of Atenean you would grow to be in the future, but don’t worry—just trust me and follow my lead.\nThis time, for your next class at Areté, why don’t you choose another route? A small quest awaits, and from there, you’ll see how great of an Atenean you will become.\n\nBest of luck!\nSincerely, future {TextInputName_player}. "
  - hide letterLayerBack: WITH FADE CONTINUE
  - hide letterLayerFront: WITH FADE CONTINUE
  - scene: intro
intro:
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - show whichPath: WITH FADE AT 725,330
  - visualchoice:
      - routeChoice1 AT 240,540:
          - var route: 1
      - routeChoice2 AT 732,540:
          - var route: 2
      - routeChoice3 AT 1200,540:
          - var route: 3
  - hide whichPath: WITH FADE
  - scene: confirmStart
confirmStart:
  - visualchoice:
      - narrator says: Your future is at stake. Are you ready to take on this journey?
      - readyBtn AT 900,580:
          - scene: goToRoute
      - notYetBtn AT 550,580:
          - scene: intro
goToRoute:
  - if ({route} == "1"):
      - scene: SecA
  - if ({route} == "2"):
      - scene: Berchmans
  - if ({route} == "3"):
      - scene: IRH
