start:
  - show sky: WITH FADE CONTINUE
  - player says: Who... am I?
  - show textBoxBg: WITH FADE AT 730,548
  - call TextInput:
    propertyType: name
    propertyName: player
  - hide textBoxBg: WITH FADE
  - scene: prologue
prologue:
  - show coveredcourts: WITH FADE CONTINUE
  - text: You just got out of your PE class and have 30 minutes to spare until your next one in Areté.
  - text: As you rummage through your bag, you come across a letter directing you to choose a different, longer path to class to determine your fate at Ateneo...
  - show introLetter: AT 720,1200
    zoom: 0
  - show bag: AT 720,1200
  - animate bag:
    time: 750
    position:
      x: 720
      y: 900
  - animate introLetter:
    time: 750
    zoom: 1
    angle: -5
    position:
      x: 720
      y: 500
  - animate introLetter:
    time: 750
    zoom: 1.75
  - hide bag: WITH FADEOUT
  - hide introLetter:
  - scene: letterOpenScene
letterOpenScene:
  - show letterLayerBack: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerMiddle: AT 720,650 WITH FUSION CONTINUE
  - show letterLayerFront: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerBack: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerFront: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerMiddle: AT 720,500 WITH MOVE
  - wait: 500
  - show letterLayerMiddleOpened: AT 720,500 WITH FUSION
  - hide letterLayerBack: WITH FADE CONTINUE
  - hide letterLayerMiddle: WITH FADE CONTINUE
  - hide letterLayerFront: WITH FADE CONTINUE
  - hide letterLayerMiddleOpened: WITH FADE CONTINUE
  - scene: intro
intro:
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - visualchoice:
      - routeChoice1 AT 240,540:
          - var route: 1
      - routeChoice2 AT 732,540:
          - var route: 2
      - routeChoice3 AT 1200,540:
          - var route: 3
  - show deuzi: happy
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route} == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH
SecA:
  - hide deuzi:
  - show SecA: WITH FADE CONTINUE
  - show MainCharacter: neutral AT 1199,1080 WITH FADE CONTINUE
  - show Students: AT 300,1140 WITH FADE
  - text: You start walking to SEC-A, and you see students hanging out at the back entrance. What do you do?
  - choice:
      - "Join and talk to them! You have plenty of time.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 1199,630 WITH CUT
          - show MainCharacterWalk: AT 825,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show MainCharacter: sparkles AT 825,1080 WITH CUT
          - show Students: normal AT 239,1080 WITH FADE
          - hide Students: WITH FADE CONTINUE
          - hide MainCharacter: WITH FADE CONTINUE
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: endGame
      - "Sit down to rest a bit and check up on your to-do list.":
          - hide SecA: WITH CUT
          - hide MainCharacter: WITH CUT
          - hide Students: WITH CUT
          - show SecA_Blurred: WITH CUT
          - call fadetime: 650
          - show todo: AT 720,1350 WITH FADE CONTINUE
          - animate todo:
            position: {x: 720, y: 630}
            zoom: 1.15
            angle: 15
            time: 450
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 2"
          - hide ALL:
          - scene: endGame
      - "Greet them but keep walking because you want to make it to class early.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 1199,630 WITH CUT
          - show MainCharacterWalk: AT 825,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show MainCharacter: sparkles AT 825,1080 WITH CUT
          - wait: 600
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 825,630 WITH CUT
          - show MainCharacterWalk: AT -239,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show Students: normal AT 239,1080
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 3"
          - hide ALL:
          - scene: endGame
      - "Sit down for a couple of minutes to listen to music and breathe in the fresh air.":
          - hide SecA: WITH CUT
          - hide MainCharacter: WITH CUT
          - hide Students: WITH CUT
          - show SecA_Blurred: WITH CUT
          - call fadetime: 650
          - show music: AT 720,1350 WITH FADE CONTINUE
          - animate music:
            position: {x: 720, y: 630}
            zoom: 1.15
            angle: 15
            time: 450
          - call fadetime: reset
          - var innovator_score: "{innovator_score} + 3"
          - var thinker_score: "{thinker_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 1"
          - hide ALL:
          - scene: endGame
Berchmans:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to Berchmans!
  - scene: endGame
IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - scene: endGame
endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
  - effect ROLLINGCREDITS:
    endGame: true
    text:
      - RenJS.V2 created by
      - lunafromthemoon
      - null
      - In collaboration with
      - RockDaFox
      - null
      - Inspired by Ren'Py
      - Powered by PhaserJS
      - null
      - null
      - Thanks for playing
      - The Quickstart Game
      - null
      - background art and cgs by
      - konett
      - null
      - characters by
      - Shida
      - null
      - music by
      - Evan Schaeffer

