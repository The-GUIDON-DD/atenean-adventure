start:
  - show sky: WITH FADE CONTINUE
  - player says: Who... am I?
  - show textBoxBg: WITH FADE AT 730,548
  - call TextInput:
    propertyType: name
    propertyName: player
  - hide textBoxBg: WITH FADE
  - scene: prologue
prologue:
  - show coveredcourts: WITH FADE CONTINUE
  - text: You just got out of your PE class and have 30 minutes to spare until your next one in Areté.
  - text: As you rummage through your bag, you come across a letter directing you to choose a different, longer path to class to determine your fate at Ateneo...
  - show introLetter: AT 720,1200
    zoom: 0
  - show bag: AT 720,1200
  - animate bag:
    time: 750
    position:
      x: 720
      y: 900
  - animate introLetter:
    time: 750
    zoom: 1
    angle: -5
    position:
      x: 720
      y: 500
  - animate introLetter:
    time: 750
    zoom: 1.75
  - hide bag: WITH FADEOUT
  - hide introLetter:
  - scene: letterOpenScene
letterOpenScene:
  - show letterLayerBack: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerMiddle: AT 720,650 WITH FUSION CONTINUE
  - show letterLayerFront: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerBack: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerFront: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerMiddle: AT 720,500 WITH MOVE
  - wait: 500
  - show letterLayerMiddleOpened: AT 720,500 WITH FUSION
  - hide letterLayerBack: WITH FADE CONTINUE
  - hide letterLayerMiddle: WITH FADE CONTINUE
  - hide letterLayerFront: WITH FADE CONTINUE
  - hide letterLayerMiddleOpened: WITH FADE CONTINUE
  - scene: intro
intro:
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - visualchoice:
      - routeChoice1 AT 240,540:
          - var route: 1
      - routeChoice2 AT 732,540:
          - var route: 2
      - routeChoice3 AT 1200,540:
          - var route: 3
  - show deuzi: happy
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice IN grid:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route} == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH
SecA:
  - hide deuzi:
  - show SecA: WITH FADE CONTINUE
  - show MainCharacter: neutral AT 1199,1080 WITH FADE CONTINUE
  - show Students: AT 300,1140 WITH FADE
  - choice IN grid:
      - text IN choice: You start walking to SEC-A, and you see students hanging out at the back entrance. What do you do?
      - "Join and talk to them! You have plenty of time.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 1199,630 WITH CUT
          - show MainCharacterWalk: AT 825,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show MainCharacter: sparkles AT 825,1080 WITH CUT
          - show Students: normal AT 239,1080 WITH FADE
          - hide Students: WITH FADE CONTINUE
          - hide MainCharacter: WITH FADE CONTINUE
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: RBR_Scene
      - "Sit down to rest a bit and check up on your to-do list.":
          - hide SecA: WITH CUT
          - hide MainCharacter: WITH CUT
          - hide Students: WITH CUT
          - show SecA_Blurred: WITH CUT
          - call fadetime: 650
          - show todo: AT 720,1350 WITH FADE CONTINUE
          - animate todo:
              position: {x: 720, y: 630}
              zoom: 1.15
          - hide ALL:
          - scene: RBR_Scene
RBR_Scene:
  - show RBR: WITH FADE CONTINUE
  - show MainCharacter: AT 200,1080 WITH FADE
  - choice IN grid:
      - text IN choice: The organization booths on Red Brick Road keep drawing you in with their initiatives, and you want to sign up.
      - "Signing up for at least one org that suits my course won't hurt. I need it for academic and professional experience!":
          - hide MainCharacter: WITH CUT
          - show RBRAnimated: WITH CUT
          - animate RBRAnimated:
            zoom: 1.25
            time: 500
          - call fadetime: 650
          - show qr: AT 239,1080 WITH FADE CONTINUE
          - animate qr:
            position: {x: 239, y: 630}
            angle: 15
            time: 450
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 2"
          - hide ALL:
          - scene: LeongHall
      - "I'll sign up for five different orgs and talk to the people manning the booths as well!":
          - hide MainCharacter: WITH CUT
          - show RBRAnimated: WITH CUT
          - animate RBRAnimated:
            zoom: 1.25
            time: 500
          - call fadetime: 650
          - show qr: AT 239,1080 WITH FADE CONTINUE
          - animate qr:
            position: {x: 239, y: 630}
            angle: 15
            time: 450
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: LeongHall
      - "I will just keep walking straight because I want to get to Areté early and prepare my notes for class.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 200,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 3"
          - hide ALL:
          - scene: LeongHall
      - "I'll sign up some other time. I want to save a table in Areté to brainstorm for an assigned project.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 200,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 3"
          - var thinker_score: "{thinker_score} + 2"
          - hide ALL:
          - scene: LeongHall
LeongHall:
  - show LeongHall: WITH FADE CONTINUE
  - show MainCharacter: normal AT 350,1080 WITH FADE CONTINUE
  - show Blockmate: talking AT 1050,1080 WITH FADE
  - choice IN grid:
      - text IN choice: You see your blockmate at Leong Hall, and they ask where you want to go after class. How will you respond?
      - "Let's go to UPTC for a little adventure!":
          - hide MainCharacter: WITH CUT
          - hide Blockmate: WITH CUT
          - show MainCharacterTalking: normal AT 350,630 WITH CUT
          - show BlockmateWalk: normal AT 1050,630 WITH CUT
          - show BlockmateWalk: AT 750,630 WITH MoveWithBounce
          - show MainCharacterTalking: AT -239,630 WITH MoveWithBounce CONTINUE
          - show BlockmateWalk: AT -239,630 WITH MoveWithBounce
          - hide MainCharacterTalking: WITH CUT
          - hide BlockmateWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: endGame
      - "Can't talk right now! I have to go, but I will text you after my class. We can eat on campus, so we can also study.":
          - hide Blockmate: WITH CUT
          - hide MainCharacter: WITH CUT
          - show Blockmate: normal AT 1050,1080 WITH CUT
          - show MainCharacterWalk: normal AT 350,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 2"
          - hide ALL:
          - scene: endGame
      - "Anywhere will do! As long as the place has a good ambiance with specialty drinks to taste-test, I'll be satisfied.":
          - hide MainCharacter: WITH CUT
          - hide Blockmate: WITH CUT
          - show MainCharacterTalking: normal AT 350,630 WITH CUT
          - show BlockmateWalk: normal AT 1050,630 WITH CUT
          - show BlockmateWalk: AT 750,630 WITH MoveWithBounce
          - show MainCharacterTalking: AT -239,630 WITH MoveWithBounce CONTINUE
          - show BlockmateWalk: AT -239,630 WITH MoveWithBounce
          - hide MainCharacterTalking: WITH CUT
          - hide BlockmateWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: endGame
      - "I'm not really feeling it because I'm so busy with studies. Let's go out some other time.":
          - hide Blockmate: WITH CUT
          - hide MainCharacter: WITH CUT
          - show Blockmate: normal AT 1050,1080 WITH CUT
          - show MainCharacterWalk: normal AT 350,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var thinker_score: "{thinker_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - hide ALL:
          - scene: endGame
Berchmans:
  - hide ALL:
  - show BerchmansBG: WITH FADE CONTINUE
  - show MainCharacter: smile WITH CUT AT LEFT CONTINUE
  - show Blockmate: neutral WITH CUT AT RIGHT
  - choice IN grid:
    - text IN choice: You see your blockmate bestie as you walk through the Berchman corridor, and they are asking where you want to go after class.
    - "Let's go to UPTC for a little adventure!":
      - MainCharacter says: "Let's go to UPTC for a little adventure!"
      - call fadetime: 500
      - show MainCharacter: talking AT OUTLEFT WITH MOVE
      - show Blockmate: neutral AT OUTLEFT WITH MOVE
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Can’t talk right now; I have to go, but I will text you after my class. We can eat on campus so we can also study":
      - MainCharacter says: "Can’t talk right now; I have to go, but I will text you after my class. We can eat on campus so we can also study"
      - call fadetime: 500
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - show Blockmate: neutral 
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 3"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
    - "Wherever! As long as the place looks aesthetic and has specialty lattes so we can take photos and taste test new drinks!":
      - MainCharacter says: "Wherever! As long as the place looks aesthetic and has specialty lattes so we can take photos and taste test new drinks!"
      - call fadetime: 500
      - show MainCharacter: talking AT OUTLEFT WITH MOVE
      - show Blockmate: neutral AT OUTLEFT WITH MOVE
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
    - "Not really feeling it because I’m so busy with studies and I have class in a bit. Let’s go out other time.":
      - MainCharacter says: "Not really feeling it because I’m so busy with studies and I have class in a bit. Let’s go out other time."
      - call fadetime: 500
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - show Blockmate: neutral
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 2"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 3"
  - hide ALL:
  - show ZenBG: WITH FUSION CONTINUE
  - show MainCharacter: smile WITH CUT AT LEFT CONTINUE 
  - choice IN grid:
    - text IN choice: You feel a bit of hunger at Zen Garden and notice a lot of food stalls. What do you do?
    - "Buy one bigger-sized snack because you need the energy for class later.":
      - hide MainCharacter:
      - show snack_large: AT 714,433 CONTINE
      - text: "Buy one bigger-sized snack because you need the energy for class later."
      - var latinhonors_score: "{latinhonors_score} + 3"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
    - "Buy snacks from different stalls because you want to support local businesses.":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - hide MainCharacter:
      - show snack_simple: AT 927,341
      - show snack_large: AT 449,418
      - show snack_unique: AT 1009,584
      - text: "Buy snacks from different stalls because you want to support local businesses."
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Buy the prettiest-looking snack to take a photo of because you enjoy anything that looks good!":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - show snack_unique: AT 685,373
      - text: "Buy the prettiest-looking snack to take a photo of because you enjoy anything that looks good!"
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
      - var thinker_score: "{thinker_score} + 1"
    - "Buy a simple, small snack that cooks fast so you don’t end up late.":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - show snack_simple: AT 720,396
      - text: "Buy a simple, small snack that cooks fast so you don’t end up late."
      - var latinhonors_score: "{latinhonors_score} + 2"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 3"
  - hide ALL:
  - show XavierHallBG: WITH FUSION CONTINUE
  - show MainCharacter: smile AT LEFT WITH FADE
  - choice IN grid:
    - text IN choice: You see so many people crowded at Xavier Hall trying to ride the E-Jeep.
    - "Line up for the E-Jeep because you want to see campus nature even if it takes longer.":
      - show XavierEJeepBG: WITH FUSION CONTINUE
      - show MainCharacter: smile AT RIGHT WITH MOVE
      - text: Line up for the E-Jeep because you want to see campus nature even if it takes longer.
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
      - var thinker_score: "{thinker_score} + 1"
    - "Squish through the people and just walk towards Arete.":
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - text: Squish through the people and just walk towards Arete.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var thinker_score: "{thinker_score} + 3"
    - "Pass the time lining up for the E-Jeep by talking to people there.":
      - show MainCharacter: talking AT RIGHT WITH FUSION
      - text: Pass the time lining up for the E-Jeep by talking to people there.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Turn around and go a different route.":
      - show MainCharacter: smile WITH CUT FLIP CONTINUE
      - show MainCharacter: smile AT OUTLEFT WITH MOVE
      - text: Turn around and go a different route.
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
  - hide ALL:
  - scene: endGame
IRH:
  - hide deuzi: WITH CUT
  - show IRHBG: WITH FADE CONTINUE
  - text: Welcome to IRH!
  - show character: happy AT OUTLEFT WITH CUT CONTINUE
  - show athlete: normal AT 1738,1080 WITH CUT CONTINUE
  - show Blockmate: normal AT 1468,1080 WITH CUT FLIP
  - call fadetime: 500
  - show character: happy AT LEFT WITH MOVE CONTINUE
  - show athlete: normal AT 1260,1080 WITH MOVE CONTINUE
  - show Blockmate: normal AT 990,1080 WITH MOVE
  - call fadetime: reset
  - choice IN grid:
      - text IN choice: You pass by a group of student-athletes, and you make eye contact with your blockmate who was walking along with the group.
      - "You both make eye contact and immediately do your secret handshake in front of everyone!":
          - show character: sparkle WITH FUSION
          - call fadetime: 500
          - show character: sparkle AT 540,1080 WITH MOVE CONTINUE
          - show Blockmate: normal AT 900,1080 WITH MOVE
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 3"
          - var socialeagle_score: "{socialeagle_score} + 0"
          - var thinker_score: "{thinker_score} + 1"
      - "Call out their name and say hi! Perhaps you’ll also ask them if they’re free for lunch tomorrow…":
          - call fadetime: 350
          - show character: talking WITH FUSION
          - show character: talking AT 540,1080 WITH MOVE CONTINUE
          - show athlete: normal AT 1170,1080 WITH MOVE CONTINUE
          - show Blockmate: normal AT 900,1080 WITH MOVE
          - show athlete: talking WITH FUSION CONTINUE
          - show Blockmate: normal WITH CUT
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - var thinker_score: "{thinker_score} + 0"
      - "You are surprised to find out that they are an athlete.":
          - call fadetime: 350
          - show character: normal AT 540,1080 WITH MOVE CONTINUE
          - show athlete: normal AT 1170,1080 WITH MOVE CONTINUE
          - show Blockmate: normal AT 900,1080 WITH MOVE
          - show character: talking WITH FUSION CONTINUE
          - show athlete: talking WITH FUSION CONTINUE
          - show Blockmate: normal WITH CUT
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 0"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 2"
          - var thinker_score: "{thinker_score} + 3"
      - "Wave at them and remind them of the group project’s deadline this week.":
          - call fadetime: 250
          - show character: talking WITH FUSION
          - wait: 500
          - show character: happy WITH FUSION
          - wait: 500
          - show IRHBGAwkward: WITH FUSION CONTINUE
          - show Blockmate: talking WITH FUSION
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 0"
          - var socialeagle_score: "{socialeagle_score} + 1"
          - var thinker_score: "{thinker_score} + 2"
  - wait: 1000
  - hide CHARS:
  - scene: Gesu
Gesu:
  - show GesuBG: WITH FADE CONTINUE
  - show crush: WITH FADE AT RIGHT FLIP CONTINUE
  - show character: nervous WITH FADE AT LEFT
  - choice IN grid:
