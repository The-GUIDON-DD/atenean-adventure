start:
  - show room: WITH FADE CONTINUE
  - show deuzi: happy AT CENTER WITH FADE
  - deuzi says: What path are you following?
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - choice:
      - "SEC-A":
          - var route: 1
      - "Berchmans":
          - var route: 2
      - "IRH":
          - var route: 3
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route}  == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH
SecA:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to SEC-A!
  - scene: endGame
Berchmans:
  - show XavierHallBG: WITH FADE CONTINUE
  - show MainCharacter: normal AT LEFT WITH FADE
  - choice IN grid:
    - text IN choice: You see so many people crowded at Xavier Hall trying to ride the E-Jeep.
    - "Line up for the E-Jeep because you want to see campus nature even if it takes longer.":
      - show XavierEJeepBG: WITH FUSION CONTINUE
      - show MainCharacter: normal AT RIGHT WITH MOVE
      - text: Line up for the E-Jeep because you want to see campus nature even if it takes longer.
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
      - var thinker_score: "{thinker_score} + 1"
    - "Squish through the people and just walk towards Arete.":
      - show MainCharacter: normal AT OUTRIGHT WITH MOVE
      - text: Squish through the people and just walk towards Arete.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var thinker_score: "{thinker_score} + 3"
    - "Pass the time lining up for the E-Jeep by talking to people there.":
      - show MainCharacter: talking AT RIGHT WITH FUSION
      - text: Pass the time lining up for the E-Jeep by talking to people there.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Turn around and go a different route.":
      - show MainCharacter: normal WITH CUT FLIP CONTINUE
      - show MainCharacter: normal AT OUTLEFT WITH MOVE
      - text: Turn around and go a different route.
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
  - hide ALL:
IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - scene: endGame
endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
  - effect ROLLINGCREDITS:
    endGame: true
    text:
