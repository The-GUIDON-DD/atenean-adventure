start:
  - show room: WITH FADE CONTINUE
  - show deuzi: happy AT CENTER WITH FADE
  - deuzi says: What path are you following?
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - choice:
      - "SEC-A":
          - var route: 1
      - "Berchmans":
          - var route: 2
      - "IRH":
          - var route: 3
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route} == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH


SecA:
  - hide deuzi:
  - show RBR: WITH FADE CONTINUE
  - text: The organization booths on Red Brick Road keep drawing you in with their initiatives, and you want to sign up.
  - show MainCharacter: AT 200,1080 WITH FADE
  - choice:
      - "Signing up for at least one org that suits my course won't hurt. I need it for academic and professional experience!":
          - hide MainCharacter: WITH CUT
          - show RBRAnimated: WITH CUT
          - animate RBRAnimated:
            zoom: 1.25
            time: 500
          - call fadetime: 650
          - show qr: AT 239,1080 WITH FADE CONTINUE
          - animate qr:
            position: {x: 239, y: 630}
            angle: 15
            time: 450
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 2"
          - hide ALL:
          - scene: SecA_3

      - "I'll sign up for five different orgs and talk to the people manning the booths as well!":
          - hide MainCharacter: WITH CUT
          - show RBRAnimated: WITH CUT
          - animate RBRAnimated:
            zoom: 1.25
            time: 500
          - call fadetime: 650
          - show qr: AT 239,1080 WITH FADE CONTINUE
          - animate qr:
            position: {x: 239, y: 630}
            angle: 15
            time: 450
          - call fadetime: reset
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: SecA_3

      - "I will just keep walking straight because I want to get to Areté early and prepare my notes for class.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 200,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 3"
          - hide ALL:
          - scene: SecA_3

      - "I'll sign up some other time. I want to save a table in Areté to brainstorm for an assigned project.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 200,630 WITH CUT
          - show MainCharacterWalk: AT 1679,630 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 3"
          - var thinker_score: "{thinker_score} + 2"
          - hide ALL:
          - scene: SecA_3


Berchmans:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to Berchmans!
  - scene: endGame

IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - scene: endGame

endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
