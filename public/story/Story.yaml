start:
  - show sky: WITH FADE CONTINUE
  - player says: Who... am I?
  - show textBoxBg: WITH FADE AT 730,548
  - call TextInput:
    propertyType: name
    propertyName: player
  - hide textBoxBg: WITH FADE
  - scene: prologue
prologue:
  - show coveredcourts: WITH FADE CONTINUE
  - text: You just got out of your PE class and have 30 minutes to spare until your next one in Areté.
  - text: As you rummage through your bag, you come across a letter directing you to choose a different, longer path to class to determine your fate at Ateneo...
  - show introLetter: AT 720,1200
    zoom: 0
  - show bag: AT 720,1200
  - animate bag:
    time: 750
    position:
      x: 720
      y: 900
  - animate introLetter:
    time: 750
    zoom: 1
    angle: -5
    position:
      x: 720
      y: 500
  - animate introLetter:
    time: 750
    zoom: 1.75
  - hide bag: WITH FADEOUT
  - hide introLetter:
  - scene: letterOpenScene
letterOpenScene:
  - show letterLayerBack: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerMiddle: AT 720,650 WITH FUSION CONTINUE
  - show letterLayerFront: AT CENTERXY WITH FUSION CONTINUE
  - show letterLayerBack: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerFront: AT 720,900 WITH MOVE CONTINUE
  - show letterLayerMiddle: AT 720,500 WITH MOVE
  - wait: 500
  - show letterLayerMiddleOpened: AT 720,500 WITH FUSION
  - hide letterLayerBack: WITH FADE CONTINUE
  - hide letterLayerMiddle: WITH FADE CONTINUE
  - hide letterLayerFront: WITH FADE CONTINUE
  - hide letterLayerMiddleOpened: WITH FADE CONTINUE
  - scene: intro
intro:
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - visualchoice:
      - routeChoice1 AT 240,540:
          - var route: 1
      - routeChoice2 AT 732,540:
          - var route: 2
      - routeChoice3 AT 1200,540:
          - var route: 3
  - show deuzi: happy
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route}  == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH
SecA:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to SEC-A!
  - scene: endGame
Berchmans:
  - show BerchmansBG: WITH FADE CONTINUE
  - show MainCharacter: smile WITH CUT AT LEFT CONTINUE
  - show Blockmate: neutral WITH CUT AT RIGHT
  - choice IN grid:
    - text IN choice: You see your blockmate bestie as you walk through the Berchman corridor, and they are asking where you want to go after class.
    - "Let's go to UPTC for a little adventure!":
      - MainCharacter says: "Let's go to UPTC for a little adventure!"
      - call fadetime: 500
      - show MainCharacter: talking AT OUTLEFT WITH MOVE
      - show Blockmate: neutral AT OUTLEFT WITH MOVE
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"

    - "Can’t talk right now; I have to go, but I will text you after my class. We can eat on campus so we can also study":
      - MainCharacter says: "Can’t talk right now; I have to go, but I will text you after my class. We can eat on campus so we can also study"
      - call fadetime: 500
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - show Blockmate: neutral 
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 3"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"

    - "Wherever! As long as the place looks aesthetic and has specialty lattes so we can take photos and taste test new drinks!":
      - MainCharacter says: "Wherever! As long as the place looks aesthetic and has specialty lattes so we can take photos and taste test new drinks!"
      - call fadetime: 500
      - show MainCharacter: talking AT OUTLEFT WITH MOVE
      - show Blockmate: neutral AT OUTLEFT WITH MOVE
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"

    - "Not really feeling it because I’m so busy with studies and I have class in a bit. Let’s go out other time.":
      - MainCharacter says: "Not really feeling it because I’m so busy with studies and I have class in a bit. Let’s go out other time."
      - call fadetime: 500
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - show Blockmate: neutral
      - call fadetime: reset
      - var latinhonors_score: "{latinhonors_score} + 2"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 3"
      
  - show ZenBG: WITH FADE CONTINUE
  - show MainCharacter: smile WITH CUT AT LEFT CONTINUE 
  - choice IN grid:
    - text IN choice: You feel a bit of hunger at Zen Garden and notice a lot of food stalls. What do you do?
    - "Buy one bigger-sized snack because you need the energy for class later.":
      - hide MainCharacter:
      - show snack_large: AT 714,433 CONTINE
      - text: "Buy one bigger-sized snack because you need the energy for class later."
      - wait: 3000
      - var latinhonors_score: "{latinhonors_score} + 3"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
    - "Buy snacks from different stalls because you want to support local businesses.":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - hide MainCharacter:
      - show snack_simple: AT 927,341
      - show snack_large: AT 449,418
      - show snack_unique: AT 1009,584
      - text: "Buy snacks from different stalls because you want to support local businesses."
      - wait: 3000
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Buy the prettiest-looking snack to take a photo of because you enjoy anything that looks good!":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - show snack_unique: AT 685,373
      - text: "Buy the prettiest-looking snack to take a photo of because you enjoy anything that looks good!"
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
      - var thinker_score: "{thinker_score} + 1"
    - "Buy a simple, small snack that cooks fast so you don’t end up late.":
      - show ZenBlurBG: WITH FUSION CONTINUE
      - show snack_simple: AT 720,396
      - text: "Buy a simple, small snack that cooks fast so you don’t end up late."
      - var latinhonors_score: "{latinhonors_score} + 2"
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 3"
  - show XavierHallBG: WITH FADE CONTINUE
  - show MainCharacter: smile AT LEFT WITH FADE
  - choice IN grid:
    - text IN choice: You see so many people crowded at Xavier Hall trying to ride the E-Jeep.
    - "Line up for the E-Jeep because you want to see campus nature even if it takes longer.":
      - show XavierEJeepBG: WITH FUSION CONTINUE
      - show MainCharacter: smile AT RIGHT WITH MOVE
      - text: Line up for the E-Jeep because you want to see campus nature even if it takes longer.
      - var innovator_score: "{innovator_score} + 3"
      - var socialeagle_score: "{socialeagle_score} + 2"
      - var thinker_score: "{thinker_score} + 1"
    - "Squish through the people and just walk towards Arete.":
      - show MainCharacter: smile AT OUTRIGHT WITH MOVE
      - text: Squish through the people and just walk towards Arete.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var thinker_score: "{thinker_score} + 3"
    - "Pass the time lining up for the E-Jeep by talking to people there.":
      - show MainCharacter: talking AT RIGHT WITH FUSION
      - text: Pass the time lining up for the E-Jeep by talking to people there.
      - var latinhonors_score: "{latinhonors_score} + 1"
      - var innovator_score: "{innovator_score} + 2"
      - var socialeagle_score: "{socialeagle_score} + 3"
    - "Turn around and go a different route.":
      - show MainCharacter: smile WITH CUT FLIP CONTINUE
      - show MainCharacter: smile AT OUTLEFT WITH MOVE
      - text: Turn around and go a different route.
      - var innovator_score: "{innovator_score} + 1"
      - var thinker_score: "{thinker_score} + 2"
  - hide ALL:
IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - scene: endGame
endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
  - effect ROLLINGCREDITS:
    endGame: true
    text:
      - RenJS.V2 created by
      - lunafromthemoon
      - null
