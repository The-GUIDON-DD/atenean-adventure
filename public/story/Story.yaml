start:
  - show room: WITH FADE CONTINUE
  - show deuzi: happy AT CENTER WITH FADE
  - deuzi says: What path are you following?
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - choice:
      - "SEC-A":
          - var route: 1
      - "Berchmans":
          - var route: 2
      - "IRH":
          - var route: 3
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route} == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH


SecA:
  - hide deuzi:
  - show LeongHall: WITH FADE CONTINUE
  - show MainCharacter: normal AT LEFT WITH FADE 
  - show Blockmate: normal AT RIGHT WITH FADE
  - text: You see your blockmate at Leong Hall, and they ask where you want to go after class. How will you respond?
  - choice:
      - "Let's go to UPTC for a little adventure!":
          - hide MainCharacter: WITH CUT
          - hide Blockmate: WITH CUT
          - show MainCharacterWalk: normal AT 133,350 WITH CUT
          - show BlockmateWalk: normal AT 666,350 WITH CUT
          - show MainCharacterWalk: AT -133,350 WITH MoveWithBounce CONTINUE
          - show BlockmateWalk: AT -133,350 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - hide BlockmateWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - hide ALL:
          - scene: endGame

      - "Can't talk right now! I have to go, but I will text you after my class. We can eat on campus, so we can also study.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 133,350 WITH CUT
          - show MainCharacterWalk: AT 933,350 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show Blockmate: normal AT RIGHT
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - var thinker_score: "{thinker_score} + 2"
          - hide ALL:
          - scene: endGame

      - "Anywhere will do! As long as the place has a good ambiance with specialty drinks to taste-test, I'll be satisfied.":
          - hide MainCharacter: WITH CUT
          - hide Blockmate: WITH CUT
          - show MainCharacterWalk: normal AT 133,350 WITH CUT
          - show BlockmateWalk: normal AT 666,350 WITH CUT
          - show MainCharacterWalk: AT -133,350 WITH MoveWithBounce CONTINUE
          - show BlockmateWalk: AT -133,350 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - hide BlockmateWalk: WITH CUT
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 3"
          - var socialeagle_score: "{socialeagle_score} + 2"
          - hide ALL:
          - scene: endGame

      - "I'm not really feeling it because I'm so busy with studies. Let's go out some other time.":
          - hide MainCharacter: WITH CUT
          - show MainCharacterWalk: normal AT 133,350 WITH CUT
          - show MainCharacterWalk: AT 933,350 WITH MoveWithBounce
          - hide MainCharacterWalk: WITH CUT
          - show Blockmate: normal AT RIGHT
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var thinker_score: "{thinker_score} + 3"
          - var innovator_score: "{innovator_score} + 1"
          - hide ALL:
          - scene: endGame

Berchmans:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to Berchmans!
  - scene: endGame

IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - scene: endGame

endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
