start:
  - show room: WITH FADE CONTINUE
  - show deuzi: happy AT CENTER WITH FADE
  - deuzi says: What path are you following?
  - var latinhonors_score: 0
  - var innovator_score: 0
  - var socialeagle_score: 0
  - var thinker_score: 0
  - choice:
      - "SEC-A":
          - var route: 1
      - "Berchmans":
          - var route: 2
      - "IRH":
          - var route: 3
  - deuzi says normal: Your future is at stake. Are you ready to take on this journey?
  - choice:
      - "Yes!":
          - if ({route} == 1):
              - scene: SecA
          - if ({route}  == 2):
              - scene: Berchmans
          - if ({route} == 3):
              - scene: IRH
SecA:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to SEC-A!
  - scene: endGame
Berchmans:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to Berchmans!
  - scene: endGame
IRH:
  - show room_night: WITH FADE CONTINUE
  - deuzi says: Welcome to IRH!
  - hide deuzi: WITH CUT
  - scene: Gesu
Gesu:
  - show GesuBG: WITH FADE CONTINUE
  - show crush: WITH FADE AT RIGHT FLIP CONTINUE
  - show character: nervous WITH FADE AT LEFT
  - text: You see your crush walking towards Gesù, and you’ve been meaning to catch their attention for a while now.
  - choice:
      - "You fix your hair and clothes, then you approach them to start a conversation.":
          - show character: sparkle WITH CUT CONTINUE
          - show crush: normal WITH CUT FLIP CONTINUE
          - show character: sparkle AT 540,1080 WITH MOVE CONTINUE
          - show crush: normal AT 900,1080 WITH MOVE
          - var latinhonors_score: "{latinhonors_score} + 2"
          - var innovator_score: "{innovator_score} + 1"
          - var socialeagle_score: "{socialeagle_score} + 3"
          - var thinker_score: "{thinker_score} + 0"
      - "You fix your posture to hopefully grab their attention as you pass by them.":
          - show character: happy WITH CUT CONTINUE
          - show character: happy AT OUTRIGHT WITH MOVE
          - var latinhonors_score: "{latinhonors_score} + 1"
          - var innovator_score: "{innovator_score} + 3"
          - var socialeagle_score: "{socialeagle_score} + 0"
          - var thinker_score: "{thinker_score} + 2"
      - "You try to say hi, but they didn’t hear you, so you end up finding a way to avoid getting noticed.":
          - show character: nervous WITH CUT CONTINUE
          - show character: nervous AT OUTLEFT WITH MOVE
          - var latinhonors_score: "{latinhonors_score} + 0"
          - var innovator_score: "{innovator_score} + 2"
          - var socialeagle_score: "{socialeagle_score} + 1"
          - var thinker_score: "{thinker_score} + 3"
      - "You look at them and realize that the spark isn’t there anymore.":
          - wait: 500
          - show character: happy WITH CUT
          - wait: 1000
          - show character: happy WITH CUT FLIP CONTINUE
          - show character: happy AT OUTLEFT WITH MOVE
          - var latinhonors_score: "{latinhonors_score} + 3"
          - var innovator_score: "{innovator_score} + 0"
          - var socialeagle_score: "{socialeagle_score} + 2"
          - var thinker_score: "{thinker_score} + 1"
  - scene: endGame
endGame:
  - deuzi says normal: Quickstart over!
  - hide ALL:
  - effect ROLLINGCREDITS:
    endGame: true
    text:
      - RenJS.V2 created by
      - lunafromthemoon
      - null
      - In collaboration with
      - RockDaFox
      - null
      - Inspired by Ren'Py
      - Powered by PhaserJS
      - null
      - null
      - Thanks for playing
      - The Quickstart Game
      - null
      - background art and cgs by
      - konett
      - null
      - characters by
      - Shida
      - null
      - music by
      - Evan Schaeffer
